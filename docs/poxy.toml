name = 'nxt'
description = 'Coroutine runtime, terminal UI, and LLM tooling for C++.'
author = 'Mikael Brockman'
github = 'mbrock/nxtui'
cpp = 23
theme = 'dark'
main_page = true
show_includes = true
generate_tagfile = true

[sources]
extract_all = true
paths = [
    '../test',
    'rfcs.md',
    'rt-overview.md',
    'rt-holding.md',
    'rt-game.md',
    'rt-occurrents.md',
    '../rfc/cur',
    '../rfc/new',
]
recursive_paths = [
    '../src',
]
patterns = [
    '*.h',
    '*.hpp',
    '*.md',
]
strip_paths = [
    '../src',
    '../test',
]
strip_includes = [
    '../src/',
]

[warnings]
treat_as_errors = false
undocumented = false
