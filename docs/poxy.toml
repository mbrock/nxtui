name = 'nxt'
description = 'Coroutine runtime, terminal UI, and LLM tooling for C++.'
author = 'Mikael Brockman'
github = 'mbrock/nxtui'
cpp = 23
theme = 'light'
stylesheets = ['technical.css']
main_page = true
show_includes = true
generate_tagfile = true
navbar = [
    '<a href="rt_overview.html">Runtime</a>',
    '<a href="wisp.html">Wisp</a>',
    'pages',
    'namespaces',
    'classes',
    'concepts',
    'files',
    'repo',
    'theme',
]

[sources]
extract_all = true
paths = [
    '../test',
    'rfcs.md',
    'rt-overview.md',
    'rt-pool.md',
    'rt-blocking.md',
    'rt-concurrency-direction.md',
    'ai-overview.md',
    'rt-holding.md',
    'rt-occurrents.md',
    'quest.md',
    'wisp.md',
    'building.md',
    '../rfc/cur',
    '../rfc/new',
]
recursive_paths = [
    '../src',
]
patterns = [
    '*.h',
    '*.hpp',
    '*.md',
]
strip_paths = [
    '../src',
    '../test',
]
strip_includes = [
    '../src/',
]

# Document every backend: the wands are selected by platform macros, and
# Doxygen otherwise sees none of them (nor nxtrt::runtime, which embeds one).
[macros]
'__linux__' = 1
'__APPLE__' = 1
'NXTRT_ARCH_HAS_WAND' = 1

[warnings]
treat_as_errors = false
undocumented = false
