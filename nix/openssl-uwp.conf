# MSVC ABI and the UWP API partition, using Linux make rather than nmake.
# Mirrors VC-WIN64A-UWP's platform constraints; no MinGW runtime or ABI.
my %targets = (
    "nxt-uwp" => {
        inherit_from => [ "BASE_unix" ],
        CC => "clang",
        CFLAGS => "-O2",
        sys_id => "WIN32",
        defines => add("OPENSSL_SYS_WIN_CORE", "WINAPI_FAMILY=WINAPI_FAMILY_APP",
                       "_WIN32_WINNT=0x0A00", "UNICODE", "_UNICODE"),
        bn_ops => "SIXTY_FOUR_BIT",
        thread_scheme => "winthreads",
        unistd => "<io.h>",
        dso_scheme => "",
        ex_libs => "-lwindowsapp",
        disable => [ "asm", "shared", "apps", "tests", "module", "dso",
                     "engine", "async", "uplink", "stdio", "ui-console",
                     "autoload-config", "pinshared", "sock" ],
    },
);
